[package]
name = "token_display"
version = "0.9.7"
description = "Claude Code plan usage indicator for menu bar / system tray"
edition = "2021"
rust-version = "1.77"

[lib]
name = "token_display_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "2.0", features = ["tray-icon"] }
# 多重起動防止。2 つ目のプロセスを即終了させ、常駐ポーラが二重に走って usage API を
# 無駄打ちする (= 429 誘発) のを防ぐ。
tauri-plugin-single-instance = "2"
# OSログイン時の自動起動 (macOS LaunchAgent / Windows 登録)
tauri-plugin-autostart = "2"
# アプリ自身の自動更新 (署名付き成果物を DL → インストール → 再起動)。
# 署名検証の公開鍵と latest.json エンドポイントは tauri.conf.json の plugins.updater に置く。
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
keyring = "3"
whoami = "1"
thiserror = "1"
# Claude Desktop の oauth:tokenCache (Electron safeStorage / Chromium os_crypt) 復号用。
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSApplication", "NSEvent", "block2"] }
block2 = "0.6"
# macOS Claude Desktop token: AES-128-CBC + PBKDF2-HMAC-SHA1(saltysalt,1003)
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Memory"] }
# Windows Claude Desktop token: AES-256-GCM (DPAPI でアンラップした os_crypt 鍵)
aes-gcm = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
