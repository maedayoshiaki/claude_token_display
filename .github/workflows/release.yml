name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Install npm dependencies
        run: npm ci

      # tauri-action がビルド → 署名 (updater 成果物 .sig) → Draft Release へ添付 →
      # latest.json を生成 / マージ (matrix の各プラットフォームが同じ Draft を更新) する。
      # 署名鍵は Secrets 経由。鍵が無いと updater 成果物の署名に失敗するので必須。
      - name: Build, sign and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          # Draft のまま公開しない。3 プラットフォーム全ての成果物と latest.json が
          # 揃ったのを確認してから GitHub の Releases 画面で publish する。
          # (draft は "latest" 扱いにならないので、揃う前に updater が中途半端な
          #  latest.json を掴むことがない。)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ## ダウンロード

            - **macOS (Apple Silicon)**: `*_aarch64.dmg`
            - **macOS (Intel)**: `*_x64.dmg`
            - **Windows**: `*_x64-setup.exe` または `*_x64_en-US.msi`

            ## 自動更新

            v0.9.0 以降は本体内から自動更新できます (更新バナーの「更新」ボタン、
            または設定 → 「更新してインストール」)。それ以前の版から上げる場合のみ、
            上記インストーラで一度手動更新してください。

            ## 前提

            表示したいプロバイダにログイン済みであること (両方でも片方でも可)。

            - **Claude**: `claude` CLI **または** Claude Desktop (Microsoft Store / MSIX 版含む) でログイン
            - **Codex**: `codex` CLI でログイン

            ## 初回起動

            **macOS**: 「開発元未確認」と出たら右クリック → 開く。
            **Windows**: SmartScreen が出たら「詳細情報」→「実行」。

            詳細は [README](https://github.com/maedayoshiaki/claude_token_display/blob/main/README.md) を参照。
